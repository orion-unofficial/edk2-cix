concurrency:
  cancel-in-progress: true
  group: "${{ github.workflow }}-${{ github.ref }}"
jobs:
  resolve-release:
    outputs:
      asset_download_url: "${{ steps.resolve.outputs.asset_download_url }}"
      asset_name: "${{ steps.resolve.outputs.asset_name }}"
      tag: "${{ steps.resolve.outputs.tag }}"
    permissions:
      contents: "read"
    runs-on: "ubuntu-latest"
    steps:
    - name: "Checkout"
      uses: "actions/checkout@v6"
      with:
        fetch-depth: 0
        fetch-tags: true
    - id: "resolve"
      name: "Resolve latest upstream release"
      run: |
        release_json="${RUNNER_TEMP}/latest-release.json"
        python3 scripts/resolve_latest_release_asset.py \
          --repo-root . \
          --github-repository "radxa-pkg/edk2-cix" \
          >"${release_json}"
        cat "${release_json}"
        python3 - "${release_json}" <<'PY' >>"${GITHUB_OUTPUT}"
        import json
        import pathlib
        import sys

        payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
        for key in ("tag", "asset_name", "asset_download_url"):
            value = payload.get(key)
            if not value:
                raise SystemExit(f"Missing {key} in resolved release payload")
            print(f"{key}={value}")
        PY
      shell: "bash"
  replay:
    needs: "resolve-release"
    permissions:
      contents: "read"
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        board:
        - "O6"
        - "O6N"
    timeout-minutes: 180
    steps:
    - name: "Checkout"
      uses: "actions/checkout@v6"
      with:
        fetch-depth: 0
        fetch-tags: true
    - name: "Check offline audit baseline schema"
      run: |
        python3 scripts/test_offline_audit_baselines.py
      shell: "bash"
    - id: "download"
      name: "Download upstream release package"
      run: |
        deb_path="${RUNNER_TEMP}/${{ needs.resolve-release.outputs.asset_name }}"
        curl \
          --fail \
          --location \
          --retry 5 \
          --retry-delay 2 \
          "${{ needs.resolve-release.outputs.asset_download_url }}" \
          --output "${deb_path}"
        echo "deb_path=${deb_path}" | tee -a "${GITHUB_OUTPUT}"
      shell: "bash"
    - name: "Run deterministic replay"
      run: |
        make deterministic-replay V=1 \
          FIRMWARE_BOARD="${{ matrix.board }}" \
          FIRMWARE_DISTRO="bookworm" \
          BUILDBOX_PLATFORM="linux/amd64" \
          REPLAY_VERSION="${{ needs.resolve-release.outputs.tag }}" \
          REPLAY_INPUT="${{ steps.download.outputs.deb_path }}"
      shell: "bash"
    - name: "Audit final firmware manifest"
      run: |
        make buildbox-audit-final-image-manifest V=1 \
          ARTEFACT_MODE="upstream" \
          FIRMWARE_BOARD="${{ matrix.board }}" \
          FIRMWARE_TARGET="RELEASE" \
          FIRMWARE_DISTRO="bookworm" \
          BUILDBOX_PLATFORM="linux/amd64" \
          FIRMWARE_VALIDATION_PROFILE="upstream-${{ needs.resolve-release.outputs.tag }}-bookworm"
      shell: "bash"
    - name: "Audit ACPI regression baseline"
      run: |
        make buildbox-audit-acpi-regression V=1 \
          ARTEFACT_MODE="upstream" \
          FIRMWARE_BOARD="${{ matrix.board }}" \
          FIRMWARE_TARGET="RELEASE" \
          FIRMWARE_DISTRO="bookworm" \
          BUILDBOX_PLATFORM="linux/amd64" \
          FIRMWARE_VALIDATION_PROFILE="upstream-${{ needs.resolve-release.outputs.tag }}-bookworm"
      shell: "bash"
    - if: "${{ always() && hashFiles('build-validation/*.json') != '' }}"
      name: "Write validation report summary"
      run: |
        python3 scripts/summarize_validation_reports.py \
          --report-root build-validation \
          --heading "Validation reports for ${{ matrix.board }} / ${{ needs.resolve-release.outputs.tag }}" \
          >>"${GITHUB_STEP_SUMMARY}"
      shell: "bash"
    - if: "${{ always() && hashFiles('build-validation/*.json', '.buildbox/replay/**/replay.env', '.buildbox/replay/**/replay-summary.json') != '' }}"
      name: "Upload replay reports"
      uses: "actions/upload-artifact@v7"
      with:
        if-no-files-found: "warn"
        name: "deterministic-replay-${{ matrix.board }}-${{ needs.resolve-release.outputs.tag }}"
        path: |
          build-validation/*.json
          .buildbox/replay/**/replay.env
          .buildbox/replay/**/replay-summary.json
name: "Deterministic Replay"
"on":
  push:
    branches:
    - "source/release/custom/edk2-202208/radxa-1.2.1/local"
  workflow_dispatch: {}
permissions:
  contents: "read"
