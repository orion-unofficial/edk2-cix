jobs:
  build:
    outputs:
      distro: "${{ steps.distro_check.outputs.distro }}"
    runs-on: "ubuntu-latest"
    steps:
    - name: "Checkout"
      uses: "actions/checkout@v6"
      with:
        fetch-depth: 0
        fetch-tags: true
    - name: "Set up QEMU Emulation"
      uses: "docker/setup-qemu-action@v4"
      with:
        image: "tonistiigi/binfmt:latest"
    # Keep the previous devcontainers/ci wiring here for easy restoration if a
    # future release gains Node 24 support. We switched to the official
    # devcontainer CLI because GitHub Actions is deprecating Node 20 for JS
    # actions and devcontainers/ci@v0.3 still warns on that runtime.
    #
    # - name: "Test"
    #   uses: "devcontainers/ci@<future-version>"
    #   with:
    #     push: "never"
    #     runCmd: |
    #       set -euo pipefail
    #       sudo apt-get update
    #       sudo apt-get install --no-install-recommends -y git-buildpackage
    #       export DEBEMAIL="github-actions@github.com"
    #       export DEBFULLNAME="GitHub Actions"
    #       git config user.name "GitHub Actions"
    #       git config user.email "github-actions@github.com"
    #       git branch -m GITHUB_RUNNER || true
    #       git branch -D main || true
    #       git switch -c main || true
    #       make dch
    #       make test deb
    #       git reset --hard HEAD~1
    #       rm ../*.deb
    # - name: "Build"
    #   uses: "devcontainers/ci@<future-version>"
    #   with:
    #     push: "never"
    #     runCmd: |
    #       set -euo pipefail
    #       make deb
    - name: "Set up Node.js"
      uses: "actions/setup-node@v6"
      with:
        node-version: "24"
    - name: "Install Dev Container CLI"
      run: |
        npm install --global @devcontainers/cli
      shell: "bash"
    - name: "Start dev container"
      run: |
        devcontainer up --workspace-folder .
      shell: "bash"
    - name: "Test"
      run: |
        devcontainer exec --workspace-folder . bash -lc '
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y git-buildpackage
          export DEBEMAIL="github-actions@github.com"
          export DEBFULLNAME="GitHub Actions"
          git config user.name "GitHub Actions"
          git config user.email "github-actions@github.com"
          git branch -m GITHUB_RUNNER || true
          git branch -D main || true
          git switch -c main || true
          make dch
          make test deb
          git reset --hard HEAD~1
          rm ../*.deb
        '
      shell: "bash"
    - name: "Build"
      run: |
        devcontainer exec --workspace-folder . bash -lc '
          set -euo pipefail
          make deb
        '
      shell: "bash"
    - id: "artifacts_path"
      name: "Workaround actions/upload-artifact#176"
      run: |
        echo "artifacts_path=$(realpath ..)" | tee -a "$GITHUB_OUTPUT"
      shell: "bash"
    - name: "Upload artifacts"
      uses: "actions/upload-artifact@v7"
      with:
        name: "${{ github.event.repository.name }}"
        path: |
          ${{ steps.artifacts_path.outputs.artifacts_path }}/*.deb
    - id: "distro_check"
      name: "Check if the latest version is releasable"
      run: |
        version="$(dpkg-parsechangelog -S Version)"
        version="${version//\~/.}"
        if [[ -n "$(git tag -l "$version")" ]]
        then
            echo "distro=UNRELEASED"
        else
            echo "distro=$(dpkg-parsechangelog -S Distribution)"
        fi | tee -a "$GITHUB_OUTPUT"
      shell: "bash"
  release:
    if: "${{ github.event_name != 'pull_request' && needs.build.outputs.distro != 'UNRELEASED' }}"
    needs: "build"
    permissions:
      contents: "write"
    runs-on: "ubuntu-latest"
    steps:
    - name: "Checkout"
      uses: "actions/checkout@v6"
    - name: "Download generated debs"
      uses: "actions/download-artifact@v8"
      with:
        name: "${{ github.event.repository.name }}"
        path: ".artifacts"
    - name: "Prepare for release"
      run: |
        version="$(dpkg-parsechangelog -S Version)"
        version="${version//\~/.}"
        {
            echo "version=$version"
            echo "changes<<EOF"
            echo '```'
            echo "$(dpkg-parsechangelog -S Changes)"
            echo '```'
            echo "EOF"
        } | tee -a "$GITHUB_ENV"
        echo "$version" | tee VERSION
        if [[ -f pkg.conf.template ]]
        then
            sed "s/VERSION/$version/g" pkg.conf.template | tee pkg.conf
        fi
      shell: "bash"
    - name: "Release"
      uses: "softprops/action-gh-release@v2"
      with:
        body_path: "README.md"
        draft: false
        fail_on_unmatched_files: false
        files: |
          .artifacts/**/*.deb
          pkg.conf
          VERSION
        prerelease: false
        tag_name: "${{ env.version }}"
        target_commitish: "${{ github.sha }}"
        token: "${{ secrets.GITHUB_TOKEN }}"
    - name: "Append changelog"
      uses: "softprops/action-gh-release@v2"
      with:
        append_body: true
        body: |
          ## Changelog for ${{ env.version }}
          ${{ env.changes }}
        tag_name: "${{ env.version }}"
name: "Build & Release"
"on":
  merge_group: {}
  pull_request:
    paths-ignore:
    - "docs/**"
    - "theme/**"
    - "po/**"
    - "book.toml"
    - ".github/workflows/docs.yaml"
  push:
    branches:
    - "main-monorepo-edk2"
    paths-ignore:
    - "docs/**"
    - "theme/**"
    - "po/**"
    - "book.toml"
    - ".github/workflows/docs.yaml"
  workflow_dispatch: {}
permissions: {}
