concurrency:
  cancel-in-progress: true
  group: "${{ github.workflow }}-${{ github.ref }}"
jobs:
  test-custom-payload-metadata:
    permissions:
      contents: "read"
    runs-on: "ubuntu-latest"
    steps:
    - name: "Checkout"
      uses: "actions/checkout@v6"
      with:
        fetch-depth: 0
    - name: "Run custom payload metadata tests"
      run: |
        python3 scripts/test_firmware_metadata_audit.py
      shell: "bash"
name: "Custom Payload Metadata"
"on":
  merge_group: {}
  pull_request: {}
  push:
    branches:
    - "source/unofficial/edk2-stable202208"
  workflow_dispatch: {}
permissions:
  contents: "read"
