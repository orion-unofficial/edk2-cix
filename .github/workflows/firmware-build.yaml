name: Firmware build

on:
  workflow_dispatch:
    inputs:
      make_target:
        default: buildbox-firmware-stage
        description: Make target to run.
        options:
          - buildbox-firmware-stage
          - buildbox-firmware-build
          - zip
          - targz
          - build-all
        required: true
        type: choice
      board:
        default: O6
        description: Firmware board.
        options:
          - O6
          - O6N
        required: true
        type: choice
      firmware_target:
        default: RELEASE
        description: Firmware build target.
        options:
          - RELEASE
          - DEBUG
        required: true
        type: choice
      enable_firmware_fixes:
        default: false
        description: Enable the project's opinionated firmware fixes in the latest source build.
        required: true
        type: boolean
      release:
        default: ''
        description: Optional source target from make help-source-targets.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  cancel-in-progress: false
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.make_target }}-${{ inputs.board }}

jobs:
  firmware:
    name: ${{ inputs.make_target }} / ${{ inputs.board }}
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Fetch source refs required by the build branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin '+refs/heads/source/*:refs/heads/source/*'
          git fetch --force origin '+refs/tags/source/*:refs/tags/source/*'

      - name: Set up QEMU for buildbox Docker platforms
        if: ${{ env.ACT != 'true' }}
        uses: docker/setup-qemu-action@v4

      - name: Build selected firmware artefact
        env:
          ENABLE_FIRMWARE_FIXES_INPUT: ${{ inputs.enable_firmware_fixes }}
          FIRMWARE_BOARD_INPUT: ${{ inputs.board }}
          FIRMWARE_TARGET_INPUT: ${{ inputs.firmware_target }}
          MAKE_TARGET_INPUT: ${{ inputs.make_target }}
          RELEASE_INPUT: ${{ inputs.release }}
        shell: bash
        run: |
          set -euo pipefail
          release_arg=()
          release="${RELEASE_INPUT}"
          if [[ -z "${release}" ]]; then
            release="$(python3 scripts/build_profiles.py --profile latest --field release)"
          fi
          release_arg=("RELEASE=${release}")
          make "${MAKE_TARGET_INPUT}" \
            "FIRMWARE_BOARD=${FIRMWARE_BOARD_INPUT}" \
            "FIRMWARE_TARGET=${FIRMWARE_TARGET_INPUT}" \
            "ARTEFACT_MODE=custom" \
            "CIX_RELEASE=v1.2" \
            "ENABLE_FIRMWARE_FIXES=${ENABLE_FIRMWARE_FIXES_INPUT}" \
            "V=1" \
            "${release_arg[@]}"

      - name: Upload generated firmware artefacts
        if: ${{ env.ACT != 'true' && always() && hashFiles('dist/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: warn
          name: firmware-${{ inputs.board }}-${{ inputs.firmware_target }}-${{ inputs.make_target }}
          path: dist/**
