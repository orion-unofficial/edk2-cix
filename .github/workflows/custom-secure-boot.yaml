concurrency:
  cancel-in-progress: true
  group: "${{ github.workflow }}-${{ github.ref }}"
jobs:
  validate-custom-secure-boot:
    permissions:
      contents: "read"
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        include:
        - board: "O6"
          product: "orion-o6"
        - board: "O6N"
          product: "orion-o6n"
    timeout-minutes: 180
    steps:
    - name: "Checkout"
      uses: "actions/checkout@v6"
      with:
        fetch-depth: 0
        fetch-tags: true
    - name: "Check pinned Microsoft Secure Boot payloads"
      run: "make -C src check-microsoft-secure-boot-defaults"
      shell: "bash"
    - name: "Build custom firmware"
      run: |
        make buildbox-firmware-build V=1 \
          ARTEFACT_MODE=custom \
          FIRMWARE_BOARD="${{ matrix.board }}" \
          FIRMWARE_PRODUCT="${{ matrix.product }}" \
          FIRMWARE_TARGET=RELEASE \
          FIRMWARE_DISTRO=bookworm \
          BUILDBOX_PLATFORM=linux/amd64
      shell: "bash"
    - name: "Validate embedded Secure Boot payloads"
      run: |
        make buildbox-validate-secure-boot-defaults V=1 \
          ARTEFACT_MODE=custom \
          FIRMWARE_BOARD="${{ matrix.board }}" \
          FIRMWARE_PRODUCT="${{ matrix.product }}" \
          FIRMWARE_TARGET=RELEASE
      shell: "bash"
name: "Custom Secure Boot"
"on":
  merge_group: {}
  pull_request: {}
  push:
    branches:
    - "source/unofficial/edk2-stable202208"
  workflow_dispatch: {}
permissions:
  contents: "read"
