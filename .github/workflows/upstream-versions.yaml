name: Upstream versions

on:
  push:
    branches:
      - build
    paths:
      - '.github/workflows/upstream-versions.yaml'
      - 'Makefile'
      - 'config/refs-*.json'
      - 'config/remotes.json'
      - 'config/upstream-versions.json'
      - 'scripts/check_upstream_versions.py'
      - 'scripts/reconstruction_common.py'
      - 'scripts/test_check_upstream_versions.py'
      - 'scripts/test_support.py'
  pull_request:
    branches:
      - build
    paths:
      - '.github/workflows/upstream-versions.yaml'
      - 'Makefile'
      - 'config/refs-*.json'
      - 'config/remotes.json'
      - 'config/upstream-versions.json'
      - 'scripts/check_upstream_versions.py'
      - 'scripts/reconstruction_common.py'
      - 'scripts/test_check_upstream_versions.py'
      - 'scripts/test_support.py'
  schedule:
    - cron: '23 2 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        default: policy
        description: Version-check failure mode.
        options:
          - advisory
          - policy
          - strict
        required: true
        type: choice
      only:
        default: ''
        description: Optional comma-separated version check IDs.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  upstream-versions:
    name: Check upstream versions
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Fetch source refs required by the build branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin '+refs/heads/source/*:refs/remotes/origin/source/*'
          git fetch --force origin '+refs/tags/source/*:refs/tags/source/*'

      - name: Check upstream versions
        env:
          UPSTREAM_VERSION_FORMAT: github
          UPSTREAM_VERSION_MODE: ${{ inputs.mode || 'policy' }}
          UPSTREAM_VERSION_ONLY: ${{ inputs.only || '' }}
        run: make check-upstream-versions
