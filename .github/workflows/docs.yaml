concurrency:
  cancel-in-progress: true
  group: "${{ github.workflow }}-${{ github.ref }}"
jobs:
  build-doc:
    permissions:
      id-token: "write"
      pages: "write"
    runs-on: "ubuntu-latest"
    steps:
    - name: "Checkout"
      uses: "actions/checkout@v6"
      with:
        fetch-depth: 0
    - name: "Install Nix"
      uses: "cachix/install-nix-action@v31"
    - name: "Use cachix"
      uses: "cachix/cachix-action@v17"
      with:
        name: "devenv"
    - name: "Install devenv.sh"
      # Intentionally unpinned for now: this follows whatever `nixpkgs#devenv`
      # resolves to on the runner at workflow time.
      # Reference point as of 2026-03-30: `nixpkgs-unstable` head
      # `b63fe7f000adcfa269967eeff72c64cafecbbebe` packaged `devenv` `2.0.6`.
      # run: "nix profile install github:cachix/devenv/v2.0.6#devenv"
      run: "nix profile install nixpkgs#devenv"
    - name: "Build"
      run: "devenv shell make docs-build"
      shell: "bash"
    - name: "Setup Pages"
      uses: "actions/configure-pages@v6"
    - name: "Upload artifact"
      uses: "actions/upload-pages-artifact@v4"
      with:
        path: "./book/html"
    - if: "github.event_name != 'pull_request'"
      name: "Deploy to GitHub Pages"
      uses: "actions/deploy-pages@v5"
name: "Deploy documentation"
"on":
  merge_group: {}
  pull_request:
    paths:
    - "docs/**"
    - "theme/**"
    - "book.toml"
    - "Makefile"
    - ".github/common/Makefile"
    - "devenv.nix"
    - "devenv.yaml"
    - "devenv.lock"
    - ".github/local/devenv.nix"
    - ".github/workflows/docs.yaml"
  push:
    branches:
    - "main-monorepo"
    paths:
    - "docs/**"
    - "theme/**"
    - "book.toml"
    - "Makefile"
    - ".github/common/Makefile"
    - "devenv.nix"
    - "devenv.yaml"
    - "devenv.lock"
    - ".github/local/devenv.nix"
    - ".github/workflows/docs.yaml"
  workflow_dispatch: {}
permissions: {}
