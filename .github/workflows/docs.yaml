concurrency:
  cancel-in-progress: true
  group: "${{ github.workflow }}-${{ github.ref }}"
jobs:
  build-doc:
    permissions:
      id-token: "write"
      pages: "write"
    runs-on: "ubuntu-latest"
    steps:
    - name: "Checkout"
      uses: "actions/checkout@v6"
      with:
        fetch-depth: 0
    - name: "Install Nix"
      uses: "cachix/install-nix-action@v31"
      with:
        # The docs job runs on ephemeral hosted Ubuntu runners, so a
        # single-user install avoids unnecessary nixbld user provisioning noise.
        install_options: "--no-daemon"
        extra_nix_config: |
          accept-flake-config = true
    - name: "Use cachix"
      uses: "cachix/cachix-action@v17"
      with:
        name: "devenv"
    - name: "Install devenv.sh"
      # Intentionally unpinned for now: this follows whatever `nixpkgs#devenv`
      # resolves to on the runner at workflow time.
      # Reference point as of 2026-03-30: `nixpkgs-unstable` head
      # `f333c713e692b687a9ed7cc38ea5738cac67d38a` carries `devenv` `2.0.7`.
      # run: "nix profile add github:cachix/devenv?ref=main#devenv"
      run: "nix profile add --accept-flake-config nixpkgs#devenv nixpkgs#cargo nixpkgs#rustc"
    - name: "Build"
      run: "./scripts/run_docs_build.sh"
      shell: "bash"
    - name: "Setup Pages"
      uses: "actions/configure-pages@v6"
    - name: "Archive Pages artifact"
      # actions/upload-pages-artifact@v4 still pins actions/upload-artifact
      # v4.6.2 internally, which triggers the hosted runner Node 20
      # deprecation warning. Archive the Pages payload inline and upload it
      # with the current Node 24-compatible action instead.
      run: |
        tar \
          --dereference --hard-dereference \
          --directory "./book/html" \
          -cvf "${RUNNER_TEMP}/artifact.tar" \
          --exclude=.git \
          --exclude=.github \
          --exclude='.[^/]*' \
          .
      shell: "bash"
    - name: "Upload artifact"
      uses: "actions/upload-artifact@v7"
      with:
        name: "github-pages"
        path: "${{ runner.temp }}/artifact.tar"
        retention-days: 1
        if-no-files-found: "error"
    - if: "github.event_name != 'pull_request'"
      name: "Deploy to GitHub Pages"
      uses: "actions/deploy-pages@v5"
name: "Deploy documentation"
"on":
  merge_group: {}
  pull_request:
    paths:
    - "docs/**"
    - "theme/**"
    - "book.toml"
    - "Makefile"
    - ".github/common/Makefile"
    - "devenv.nix"
    - "devenv.yaml"
    - "devenv.lock"
    - ".github/local/devenv.nix"
    - ".github/workflows/docs.yaml"
  push:
    branches:
    - "source/unofficial/current"
    paths:
    - "docs/**"
    - "theme/**"
    - "book.toml"
    - "Makefile"
    - ".github/common/Makefile"
    - "devenv.nix"
    - "devenv.yaml"
    - "devenv.lock"
    - ".github/local/devenv.nix"
    - ".github/workflows/docs.yaml"
  workflow_dispatch: {}
permissions: {}
