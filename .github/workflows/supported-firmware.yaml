name: Supported firmware release matrix

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    name: Enumerate supported release targets
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.matrix.outputs.builds }}
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch required source refs
        run: |
          git fetch --force --no-tags origin '+refs/heads/source/*:refs/heads/source/*'
          git fetch --force origin '+refs/tags/source/*:refs/tags/source/*'
      - name: Derive primary qualification matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          builds="$(python3 scripts/firmware_ci_matrix.py)"
          echo "builds=${builds}" >>"${GITHUB_OUTPUT}"

  firmware:
    name: >-
      ${{ matrix.release }} / ${{ matrix.board }} /
      fixes ${{ matrix.firmware_fixes }} / settings ${{ matrix.experimental }}
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.matrix.outputs.builds) }}
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch required source refs
        run: |
          git fetch --force --no-tags origin '+refs/heads/source/*:refs/heads/source/*'
          git fetch --force origin '+refs/tags/source/*:refs/tags/source/*'
      - name: Set up QEMU for buildbox Docker platforms
        if: ${{ env.ACT != 'true' }}
        uses: docker/setup-qemu-action@v4
      - name: Compile and package through the public Makefile
        env:
          RELEASE: ${{ matrix.release }}
          FIRMWARE_BOARD: ${{ matrix.board }}
          ENABLE_FIRMWARE_FIXES: ${{ matrix.firmware_fixes }}
          ENABLE_EXPERIMENTAL_UEFI_SETTINGS: ${{ matrix.experimental }}
          EDK2_CIX_WORKTREE_NAMESPACE: ${{ matrix.key }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/edk2-cix/qualification
          make build \
            RELEASE="${RELEASE}" \
            ARTEFACT_MODE=custom \
            FIRMWARE_BOARD="${FIRMWARE_BOARD}" \
            FIRMWARE_TARGET=RELEASE \
            FIRMWARE_DISTRO=trixie \
            ENABLE_FIRMWARE_FIXES="${ENABLE_FIRMWARE_FIXES}" \
            ENABLE_CORE_ORDER=cix \
            ENABLE_EXPERIMENTAL_UEFI_SETTINGS="${ENABLE_EXPERIMENTAL_UEFI_SETTINGS}" \
            DEBUG_VERBOSE=false \
            CIX_RELEASE= \
            2>&1 | tee .cache/edk2-cix/qualification/build.log
          python3 - <<'PY'
          from pathlib import Path
          images = list(Path('dist/build').rglob('cix_flash_all.bin'))
          assert images and all(p.stat().st_size > 0 for p in images), 'No packaged full flash image'
          PY
      - name: Upload build evidence
        if: ${{ always() && env.ACT != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.key }}
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            .cache/edk2-cix/qualification/
            dist/**/cix_flash_all.bin
            dist/**/BuildOptions
            dist/**/bootloader1-validation.json

  cix-signed-1-2-4:
    name: CIX-signed ${{ matrix.track }} EDK2 / Radxa 1.2.4 / O6
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        track: [baseline, latest]
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch required source refs
        run: |
          git fetch --force --no-tags origin '+refs/heads/source/*:refs/heads/source/*'
          git fetch --force origin '+refs/tags/source/*:refs/tags/source/*'
      - name: Set up QEMU for buildbox Docker platforms
        if: ${{ env.ACT != 'true' }}
        uses: docker/setup-qemu-action@v4
      - name: Build and validate the CIX-signed 1.2.4 image
        shell: bash
        env:
          EDK2_CIX_WORKTREE_NAMESPACE: cix-signed-radxa-1-2-4-${{ matrix.track }}
        run: |
          set -euo pipefail
          mkdir -p .cache/edk2-cix/qualification
          edk2_release="$(python3 - '${{ matrix.track }}' <<'PY'
          import json
          from pathlib import Path
          import sys
          policy = json.loads(Path('config/policies.json').read_text())
          if sys.argv[1] == 'baseline':
              print(policy['firmware_qualification_policy']['baseline_edk2_release'])
          else:
              source = policy['unofficial_source_policy']
              print(source['lines'][source['default_line']]['current_edk2_release'])
          PY
          )"
          release="edk2-${edk2_release}/radxa-1.2.4/unofficial"
          make build \
            RELEASE="${release}" \
            ARTEFACT_MODE=custom \
            FIRMWARE_BOARD=O6 \
            FIRMWARE_TARGET=RELEASE \
            FIRMWARE_DISTRO=trixie \
            ENABLE_FIRMWARE_FIXES=true \
            ENABLE_CORE_ORDER=cix \
            ENABLE_EXPERIMENTAL_UEFI_SETTINGS=false \
            DEBUG_VERBOSE=false \
            CIX_RELEASE=1.2 \
            2>&1 | tee .cache/edk2-cix/qualification/cix-signed-1.2.4.log
          python3 - "${release}" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys
          root = Path('dist/build') / sys.argv[1] / 'custom+fixes/O6'
          images = list(root.glob('RELEASE_GCC*/cix_flash_all.bin'))
          if len(images) != 1:
              raise RuntimeError(f'Expected one packaged image under {root}, found {len(images)}')
          image = images[0]
          report = image.with_name('firmware-chain-validation.json')
          assert image.stat().st_size == 0x800000, image
          assert json.loads(report.read_text())['status'] == 'verified', report
          print(f'{hashlib.sha256(image.read_bytes()).hexdigest()}  {image}')
          PY
      - name: Upload CIX-signed 1.2.4 build evidence
        if: ${{ always() && env.ACT != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: cix-signed-radxa-1.2.4-o6-${{ matrix.track }}
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            .cache/edk2-cix/qualification/cix-signed-1.2.4.log
            dist/**/cix_flash_all.bin
            dist/**/BuildOptions
            dist/**/bootloader1-validation.json
            dist/**/firmware-chain-validation.json
