name: Current-source firmware validation

on:
  workflow_call:
    inputs:
      release:
        default: ''
        required: false
        type: string
      firmware_distro:
        default: trixie
        required: false
        type: string
  workflow_dispatch:
    inputs:
      release:
        default: ''
        description: Optional source target from make help-source-targets.
        required: false
        type: string
      firmware_distro:
        default: trixie
        description: Buildbox distro for custom firmware validation.
        options:
          - trixie
          - bookworm
        required: true
        type: choice

permissions:
  contents: read

env:
  FIRMWARE_DISTRO: ${{ inputs.firmware_distro || 'trixie' }}
  FIRMWARE_SOURCE_TARGET: ${{ inputs.release || '' }}

jobs:
  metadata:
    name: Payload metadata and Microsoft version
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Fetch source refs required by the build branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin '+refs/heads/source/*:refs/heads/source/*'
          git fetch --force origin '+refs/tags/source/*:refs/tags/source/*'

      - name: Render selected firmware tree
        env:
          EDK2_CIX_WORKTREE_NAMESPACE: metadata
        shell: bash
        run: |
          set -euo pipefail
          release="${FIRMWARE_SOURCE_TARGET}"
          if [[ -z "${release}" ]]; then
            release="$(python3 scripts/build_profiles.py --profile latest --field release)"
          fi
          worktree="$(
            python3 scripts/render_release_branch.py \
              --release "${release}" \
              --ensure-worktree \
              --print-worktree
          )"
          echo "FIRMWARE_REBUILD_RELEASE=${release}" >>"${GITHUB_ENV}"
          echo "FIRMWARE_WORKTREE=${worktree}" >>"${GITHUB_ENV}"
          echo "FIRMWARE_CACHE=${worktree}/.cache/edk2-cix/firmware" >>"${GITHUB_ENV}"
          buildbox_name_file="${worktree}/.cache/edk2-cix/firmware/buildbox/buildbox-name"
          echo "EDK2_CIX_BUILDBOX_NAME_FILE=${buildbox_name_file}" >>"${GITHUB_ENV}"

      - name: Test firmware payload metadata audit
        run: python3 "${FIRMWARE_WORKTREE}/scripts/test_firmware_metadata_audit.py"

      - name: Check pinned Microsoft Secure Boot release version
        shell: bash
        run: |
          set -euo pipefail
          make -C "${FIRMWARE_WORKTREE}/src" check-microsoft-secure-boot-release \
            MICROSOFT_SECURE_BOOT_RELEASE_CHECK_MODE=strict

  secure-boot:
    name: ${{ matrix.board }} / fixes ${{ matrix.firmware_fixes }} / experimental ${{ matrix.experimental }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - board: O6
            firmware_fixes: false
            experimental: false
            debug_mask: "0x80000001"
          - board: O6
            firmware_fixes: true
            experimental: false
            debug_mask: "0x80000001"
          - board: O6N
            firmware_fixes: false
            experimental: false
            debug_mask: "0x80000001"
          - board: O6N
            firmware_fixes: true
            experimental: false
            debug_mask: "0x80000001"
          - board: O6
            firmware_fixes: true
            experimental: true
            debug_mask: "0x80000040"
          - board: O6N
            firmware_fixes: true
            experimental: true
            debug_mask: "0x80000040"

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Fetch source refs required by the build branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin '+refs/heads/source/*:refs/heads/source/*'
          git fetch --force origin '+refs/tags/source/*:refs/tags/source/*'

      - name: Set up QEMU for buildbox Docker platforms
        if: ${{ env.ACT != 'true' }}
        uses: docker/setup-qemu-action@v4

      - name: Render selected firmware tree
        env:
          EDK2_CIX_WORKTREE_NAMESPACE: >-
            secure-boot-${{ matrix.board }}-fixes-${{ matrix.firmware_fixes }}-experimental-${{ matrix.experimental }}
        shell: bash
        run: |
          set -euo pipefail
          release="${FIRMWARE_SOURCE_TARGET}"
          if [[ -z "${release}" ]]; then
            release="$(python3 scripts/build_profiles.py --profile latest --field release)"
          fi
          worktree="$(
            python3 scripts/render_release_branch.py \
              --release "${release}" \
              --ensure-worktree \
              --print-worktree
          )"
          echo "FIRMWARE_REBUILD_RELEASE=${release}" >>"${GITHUB_ENV}"
          echo "FIRMWARE_WORKTREE=${worktree}" >>"${GITHUB_ENV}"
          echo "FIRMWARE_CACHE=${worktree}/.cache/edk2-cix/firmware" >>"${GITHUB_ENV}"
          buildbox_name_file="${worktree}/.cache/edk2-cix/firmware/buildbox/buildbox-name"
          echo "EDK2_CIX_BUILDBOX_NAME_FILE=${buildbox_name_file}" >>"${GITHUB_ENV}"

      - name: Check pinned Microsoft Secure Boot payloads
        shell: bash
        run: |
          set -euo pipefail
          make -C "${FIRMWARE_WORKTREE}/src" check-microsoft-secure-boot-defaults

      - name: Build and stage custom firmware
        shell: bash
        run: |
          set -euo pipefail
          validation_profile="current-${{ matrix.board }}-fixes-${{ matrix.firmware_fixes }}"
          validation_profile+="-experimental-${{ matrix.experimental }}"
          python3 scripts/validate_bootloader1.py --worktree "${FIRMWARE_WORKTREE}" \
            --phase inputs --board "${{ matrix.board }}" --cix-release "" \
            --report .cache/edk2-cix/qualification/bootloader1-validation.json
          python3 scripts/validate_firmware_chain.py --worktree "${FIRMWARE_WORKTREE}" \
            --phase inputs --board "${{ matrix.board }}" --cix-release "" \
            --report .cache/edk2-cix/qualification/firmware-chain-validation.json
          make -C "${FIRMWARE_WORKTREE}" buildbox-firmware-stage V=1 \
            ARTEFACT_MODE=custom \
            CIX_RELEASE= \
            DEBUG_VERBOSE=false DEBUG_PRINT_ERROR_LEVEL="${{ matrix.debug_mask }}" \
            ENABLE_EXPERIMENTAL_UEFI_SETTINGS="${{ matrix.experimental }}" \
            FIRMWARE_REBUILD_RELEASE="${FIRMWARE_REBUILD_RELEASE}" \
            FIRMWARE_REBUILD_BUILD_COMMIT="$(git rev-parse HEAD)" \
            ENABLE_FIRMWARE_FIXES="${{ matrix.firmware_fixes }}" \
            FIRMWARE_BOARD="${{ matrix.board }}" \
            FIRMWARE_TARGET=RELEASE \
            FIRMWARE_DISTRO="${FIRMWARE_DISTRO}" \
            BUILDBOX_PLATFORM=linux/amd64 \
            BUILDBOX_HOST_TMPDIR="${FIRMWARE_CACHE}/buildbox/tmp" \
            CCACHE_DIR="${FIRMWARE_CACHE}/ccache" \
            CCACHE_WRAPPER_ROOT="${FIRMWARE_CACHE}/ccache-toolchain" \
            CIX_RELEASE_CACHE_ROOT="${FIRMWARE_CACHE}/cix-release" \
            FIPTOOL_DISTRO_STAMP="${FIRMWARE_CACHE}/buildbox/fiptool/.buildbox-distro" \
            FIRMWARE_VALIDATION_REPORT_ROOT="${FIRMWARE_CACHE}/build-validation" \
            FIRMWARE_VALIDATION_PROFILE="${validation_profile}-${FIRMWARE_DISTRO}"
          python3 scripts/validate_bootloader1.py --worktree "${FIRMWARE_WORKTREE}" \
            --phase outputs --build-target buildbox-firmware-stage \
            --board "${{ matrix.board }}" --cix-release "" \
            --report .cache/edk2-cix/qualification/bootloader1-validation.json
          python3 scripts/validate_firmware_chain.py --worktree "${FIRMWARE_WORKTREE}" \
            --phase outputs --build-target buildbox-firmware-stage \
            --board "${{ matrix.board }}" --cix-release "" \
            --report .cache/edk2-cix/qualification/firmware-chain-validation.json

      - name: Validate embedded Secure Boot payloads
        shell: bash
        run: |
          set -euo pipefail
          validation_profile="current-${{ matrix.board }}-fixes-${{ matrix.firmware_fixes }}"
          validation_profile+="-experimental-${{ matrix.experimental }}"
          make -C "${FIRMWARE_WORKTREE}" buildbox-validate-secure-boot-defaults V=1 \
            ARTEFACT_MODE=custom \
            CIX_RELEASE= \
            DEBUG_VERBOSE=false DEBUG_PRINT_ERROR_LEVEL="${{ matrix.debug_mask }}" \
            ENABLE_EXPERIMENTAL_UEFI_SETTINGS="${{ matrix.experimental }}" \
            FIRMWARE_REBUILD_RELEASE="${FIRMWARE_REBUILD_RELEASE}" \
            FIRMWARE_REBUILD_BUILD_COMMIT="$(git rev-parse HEAD)" \
            ENABLE_FIRMWARE_FIXES="${{ matrix.firmware_fixes }}" \
            FIRMWARE_BOARD="${{ matrix.board }}" \
            FIRMWARE_TARGET=RELEASE \
            FIRMWARE_DISTRO="${FIRMWARE_DISTRO}" \
            BUILDBOX_PLATFORM=linux/amd64 \
            BUILDBOX_HOST_TMPDIR="${FIRMWARE_CACHE}/buildbox/tmp" \
            CCACHE_DIR="${FIRMWARE_CACHE}/ccache" \
            CCACHE_WRAPPER_ROOT="${FIRMWARE_CACHE}/ccache-toolchain" \
            CIX_RELEASE_CACHE_ROOT="${FIRMWARE_CACHE}/cix-release" \
            FIPTOOL_DISTRO_STAMP="${FIRMWARE_CACHE}/buildbox/fiptool/.buildbox-distro" \
            FIRMWARE_VALIDATION_REPORT_ROOT="${FIRMWARE_CACHE}/build-validation" \
            FIRMWARE_VALIDATION_PROFILE="${validation_profile}-${FIRMWARE_DISTRO}"

      - name: Compile curated TF-A and OP-TEE and verify their CIX-rooted FIPs
        if: matrix.board == 'O6' && matrix.firmware_fixes == true && matrix.experimental == false
        shell: bash
        env:
          BUILDBOX_PLATFORM: linux/amd64
        run: |
          set -euo pipefail
          if [[ ! -f "${FIRMWARE_WORKTREE}/custom/signing-keys/cix-1.2/cix_privatekey.pem" ]]; then
            echo "Selected source checkpoint does not support CIX_RELEASE=1.2; skipping its optional qualification."
            exit 0
          fi
          python3 scripts/qualify_source_trusted_firmware.py \
            --worktree "${FIRMWARE_WORKTREE}" \
            --report .cache/edk2-cix/qualification/trusted-source-chain.json

      - name: Build and verify the source-signed CIX image after the stock image
        if: matrix.board == 'O6' && matrix.firmware_fixes == true && matrix.experimental == false
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "${FIRMWARE_WORKTREE}/custom/signing-keys/cix-1.2/cix_privatekey.pem" ]]; then
            echo "Selected source checkpoint does not support CIX_RELEASE=1.2; skipping its optional image build."
            exit 0
          fi
          make -C "${FIRMWARE_WORKTREE}" buildbox-firmware-build \
            ARTEFACT_MODE=custom CIX_RELEASE=1.2 ENABLE_TF_A_FIXES=false \
            FIRMWARE_BOARD=O6 FIRMWARE_TARGET=RELEASE \
            FIRMWARE_DISTRO="${FIRMWARE_DISTRO}" BUILDBOX_PLATFORM=linux/amd64 \
            ENABLE_FIRMWARE_FIXES=true ENABLE_EXPERIMENTAL_UEFI_SETTINGS=false \
            DEBUG_VERBOSE=false DEBUG_PRINT_ERROR_LEVEL="${{ matrix.debug_mask }}" \
            FIRMWARE_REBUILD_RELEASE="${FIRMWARE_REBUILD_RELEASE}" \
            FIRMWARE_REBUILD_BUILD_COMMIT="$(git rev-parse HEAD)" \
            BUILDBOX_HOST_TMPDIR="${FIRMWARE_CACHE}/buildbox/tmp" \
            CCACHE_DIR="${FIRMWARE_CACHE}/ccache" \
            CCACHE_WRAPPER_ROOT="${FIRMWARE_CACHE}/ccache-toolchain" \
            CIX_RELEASE_CACHE_ROOT="${FIRMWARE_CACHE}/cix-release" \
            FIPTOOL_DISTRO_STAMP="${FIRMWARE_CACHE}/buildbox/fiptool/.buildbox-distro"
          python3 scripts/validate_bootloader1.py --worktree "${FIRMWARE_WORKTREE}" \
            --phase outputs --build-target buildbox-firmware-build \
            --board O6 --cix-release 1.2 \
            --report .cache/edk2-cix/qualification/cix-source-bl1.json
          python3 scripts/validate_firmware_chain.py --worktree "${FIRMWARE_WORKTREE}" \
            --phase outputs --build-target buildbox-firmware-build \
            --board O6 --cix-release 1.2 \
            --report .cache/edk2-cix/qualification/cix-source-chain.json

      - name: Collect Secure Boot reports
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${FIRMWARE_CACHE:-}" || -z "${FIRMWARE_WORKTREE:-}" ]]; then
            echo "Firmware render did not complete; no reports were available to collect." \
              >>"${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          artifact_root="${RUNNER_TEMP}/ci-artifacts/${{ matrix.board }}-fixes-${{ matrix.firmware_fixes }}"
          artifact_root+="-experimental-${{ matrix.experimental }}"
          mkdir -p "${artifact_root}"
          if [[ -f .cache/edk2-cix/qualification/bootloader1-validation.json ]]; then
            cp .cache/edk2-cix/qualification/bootloader1-validation.json "${artifact_root}/"
          fi
          if [[ -f .cache/edk2-cix/qualification/firmware-chain-validation.json ]]; then
            cp .cache/edk2-cix/qualification/firmware-chain-validation.json "${artifact_root}/"
          fi
          if [[ -f .cache/edk2-cix/qualification/trusted-source-chain.json ]]; then
            cp .cache/edk2-cix/qualification/trusted-source-chain.json "${artifact_root}/"
          fi
          for report in cix-source-bl1.json cix-source-chain.json; do
            if [[ -f ".cache/edk2-cix/qualification/${report}" ]]; then
              cp ".cache/edk2-cix/qualification/${report}" "${artifact_root}/"
            fi
          done
          if [[ -d "${FIRMWARE_CACHE}/build-validation" ]]; then
            cp -a "${FIRMWARE_CACHE}/build-validation" "${artifact_root}/build-validation"
            python3 "${FIRMWARE_WORKTREE}/scripts/summarize_validation_reports.py" \
              --report-root "${FIRMWARE_CACHE}/build-validation" \
              --heading "Validation reports for ${{ matrix.board }} / firmware fixes ${{ matrix.firmware_fixes }}" \
              >>"${GITHUB_STEP_SUMMARY}"
          fi
          if [[ -d "${FIRMWARE_WORKTREE}/dist" ]]; then
            cp -a "${FIRMWARE_WORKTREE}/dist" "${artifact_root}/dist"
          fi

      - name: Upload Secure Boot reports
        if: ${{ always() && env.ACT != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: warn
          name: >-
            current-${{ matrix.board }}-fixes-${{ matrix.firmware_fixes }}-experimental-${{ matrix.experimental }}
          path: ${{ runner.temp }}/ci-artifacts/**
