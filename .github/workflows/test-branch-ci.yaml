name: Test branch qualification

on:
  pull_request:
    branches:
      - test
  push:
    branches:
      - test

permissions:
  contents: read

concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: >-
    ${{ github.workflow }}-${{
      github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id
    }}

jobs:
  maintenance-tests:
    name: Extended maintenance tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout test candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch source refs required by the build model
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin '+refs/heads/source/*:refs/heads/source/*'
          git fetch --force origin '+refs/tags/source/*:refs/tags/source/*'

      - name: Run extended source-model tests
        run: make test

      - name: Run lint checks
        run: make lint

  documentation:
    name: Maintenance documentation
    permissions:
      contents: read
      id-token: write
      pages: write
    uses: ./.github/workflows/build-docs.yaml

  qualification:
    name: Test qualification summary
    if: ${{ always() }}
    needs:
      - maintenance-tests
      - documentation
    runs-on: ubuntu-latest

    steps:
      - name: Report test qualification result
        env:
          DOCUMENTATION_RESULT: ${{ needs.documentation.result }}
          MAINTENANCE_TESTS_RESULT: ${{ needs.maintenance-tests.result }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Test branch qualification"
            echo
            echo "| Gate | Result |"
            echo "| --- | --- |"
            echo "| Extended maintenance tests | ${MAINTENANCE_TESTS_RESULT} |"
            echo "| Maintenance documentation | ${DOCUMENTATION_RESULT} |"
          } >>"${GITHUB_STEP_SUMMARY}"
          [[ "${MAINTENANCE_TESTS_RESULT}" == success ]]
          [[ "${DOCUMENTATION_RESULT}" == success ]]
