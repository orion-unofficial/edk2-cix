name: Firmware qualification

on:
  merge_group:
  pull_request:
    branches:
      - build
  push:
    branches:
      - build
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: >-
    ${{ github.workflow }}-${{
      github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id
    }}

jobs:
  classify:
    name: Classify change
    runs-on: ubuntu-latest
    outputs:
      build_affecting: ${{ steps.changes.outputs.build_affecting }}
      reason: ${{ steps.changes.outputs.reason }}

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify firmware impact
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == workflow_dispatch || "${EVENT_NAME}" == merge_group ]]; then
            echo "build_affecting=true" >>"${GITHUB_OUTPUT}"
            echo "reason=${EVENT_NAME} requests full qualification" >>"${GITHUB_OUTPUT}"
            exit 0
          fi
          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]] \
            || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "build_affecting=true" >>"${GITHUB_OUTPUT}"
            echo "reason=no comparable base commit" >>"${GITHUB_OUTPUT}"
            exit 0
          fi
          mapfile -t changed < <(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")
          if ((${#changed[@]} == 0)); then
            echo "build_affecting=false" >>"${GITHUB_OUTPUT}"
            echo "reason=no changed paths" >>"${GITHUB_OUTPUT}"
            exit 0
          fi
          for path in "${changed[@]}"; do
            case "${path}" in
              README.md|LICENSES/*|docs/*) ;;
              *)
                echo "build_affecting=true" >>"${GITHUB_OUTPUT}"
                echo "reason=firmware-affecting path: ${path}" >>"${GITHUB_OUTPUT}"
                exit 0
                ;;
            esac
          done
          echo "build_affecting=false" >>"${GITHUB_OUTPUT}"
          echo "reason=documentation/licensing-only change" >>"${GITHUB_OUTPUT}"

  source-coherence:
    name: Published source-ref coherence
    needs: classify
    if: ${{ needs.classify.outputs.build_affecting == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout candidate build metadata
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compare published source refs with candidate metadata
        run: make check-remote-source-coherence REMOTE=origin

  source-model:
    name: Source model, lint, and minimised clone
    needs:
      - classify
      - source-coherence
    if: ${{ always() && needs.classify.outputs.build_affecting == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch source refs required by the build branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin '+refs/heads/source/*:refs/heads/source/*'
          git fetch --force origin '+refs/tags/source/*:refs/tags/source/*'

      - name: Prepare exact candidate refs already present in the runner
        id: prepare_source_refs
        if: ${{ always() }}
        continue-on-error: true
        run: make prepare-ci-source-refs WRITE=1

      - name: Run source-model tests
        id: source_model_tests
        if: ${{ always() }}
        run: make test

      - name: Run lint checks
        id: lint_checks
        if: ${{ always() }}
        run: make lint

      - name: Require every source-model diagnostic
        if: ${{ always() }}
        env:
          LINT_OUTCOME: ${{ steps.lint_checks.outcome }}
          PREPARE_OUTCOME: ${{ steps.prepare_source_refs.outcome }}
          TEST_OUTCOME: ${{ steps.source_model_tests.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${PREPARE_OUTCOME}" == success ]]
          [[ "${TEST_OUTCOME}" == success ]]
          [[ "${LINT_OUTCOME}" == success ]]

  current-source:
    name: Current-source firmware matrix
    needs:
      - classify
      - source-coherence
    if: ${{ needs.classify.outputs.build_affecting == 'true' }}
    uses: ./.github/workflows/secure-boot-audit.yaml
    with:
      firmware_distro: trixie

  upstream-replay:
    name: Exact upstream replay matrix
    needs:
      - classify
      - source-coherence
    if: ${{ needs.classify.outputs.build_affecting == 'true' }}
    uses: ./.github/workflows/deterministic-replay.yaml
    with:
      replay_source_target: edk2-202208/radxa-1.3.1
      replay_version: 1.3.1
      upstream_repository: radxa-pkg/edk2-cix

  qualification:
    name: Qualification summary
    if: ${{ always() }}
    needs:
      - classify
      - source-coherence
      - source-model
      - current-source
      - upstream-replay
    runs-on: ubuntu-latest

    steps:
      - name: Report qualification result
        env:
          BUILD_AFFECTING: ${{ needs.classify.outputs.build_affecting }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          CURRENT_SOURCE_RESULT: ${{ needs.current-source.result }}
          REASON: ${{ needs.classify.outputs.reason }}
          SOURCE_COHERENCE_RESULT: ${{ needs.source-coherence.result }}
          SOURCE_MODEL_RESULT: ${{ needs.source-model.result }}
          UPSTREAM_REPLAY_RESULT: ${{ needs.upstream-replay.result }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Firmware qualification"
            echo
            echo "Classification: ${REASON:-unavailable}"
            echo
            echo "| Gate | Result |"
            echo "| --- | --- |"
            echo "| Classifier | ${CLASSIFY_RESULT} |"
            echo "| Published source refs | ${SOURCE_COHERENCE_RESULT} |"
            echo "| Source model | ${SOURCE_MODEL_RESULT} |"
            echo "| Current-source O6/O6N, fixes off/on | ${CURRENT_SOURCE_RESULT} |"
            echo "| Radxa 1.3.1 exact replay, O6/O6N | ${UPSTREAM_REPLAY_RESULT} |"
          } >>"${GITHUB_STEP_SUMMARY}"
          [[ "${CLASSIFY_RESULT}" == success ]]
          if [[ "${BUILD_AFFECTING}" == true ]]; then
            [[ "${SOURCE_COHERENCE_RESULT}" == success ]]
            [[ "${SOURCE_MODEL_RESULT}" == success ]]
            [[ "${CURRENT_SOURCE_RESULT}" == success ]]
            [[ "${UPSTREAM_REPLAY_RESULT}" == success ]]
          fi
