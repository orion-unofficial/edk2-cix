[book]
authors = ["Radxa Limited"]
language = "en"
src = "docs"
title = "edk2-cix"

[output.linkcheck]

[output.html]
git-repository-url = "https://github.com/radxa-pkg/edk2-cix/tree/main-monorepo"
edit-url-template = "https://github.com/radxa-pkg/edk2-cix/edit/main-monorepo/{path}"
additional-css = [
    "./theme/css/mdbook-admonish.css",
]

[preprocessor.admonish]
command = "mdbook-admonish"
assets_version = "3.0.2" # do not edit: managed by `mdbook-admonish install`

[preprocessor.toc]
command = "mdbook-toc"
renderer = ["html"]

[preprocessor.cmdrun]
